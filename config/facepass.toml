# FacePass Configuration File
# Location: /etc/facepass/config.toml

[video]
# Camera device path (use `ls /dev/video*` to find available devices)
device = "/dev/video0"

# Authentication timeout in seconds (0 = unlimited)
timeout = 5

# Maximum frames to try before giving up (0 = unlimited)
max_frames = 30

# Frame width (0 = auto)
frame_width = 640

# Frame height (0 = auto)
frame_height = 480

[detection]
# YuNet face detection confidence threshold (0.0 - 1.0)
score_threshold = 0.9

# Overlap threshold for removing duplicate face boxes (lower = stricter)
nms_threshold = 0.3

# Input size for YuNet model
input_width = 320
input_height = 320

[recognition]
# SFace cosine similarity threshold (higher = stricter)
# Recommended: 0.363 (OpenCV default) to 0.5
similarity_threshold = 0.4

# Maximum faces per user
max_faces_per_user = 5

# Number of consecutive matched frames required
consecutive_match_frames = 1

# Minimum number of valid recognition frames required per attempt (0 = disabled)
valid_frames = 5

# Whether to stop immediately once valid_frames has been reached
# Ignored when valid_frames = 0
stop_on_valid_frames = true

# Only faces that are fully inside the frame and can fully cover the
# configured valid square crop range will enter liveness + recognition.
# The square crop area is face_area * valid_crop_scale^2.
valid_crop_scale = 2.7

[security]
# Skip face recognition for SSH sessions
ignore_ssh = true

# Skip face recognition when laptop lid is closed
ignore_closed_lid = true

# Show desktop notification during authentication
show_notification = false

[daemon]
# Unix socket path for IPC
socket_path = "/run/facepass/facepass.sock"

# Log level: trace, debug, info, warn, error
log_level = "info"

# PID file path
pid_file = "/run/facepass/facepass.pid"

[models]
# Path to YuNet face detection model
yunet_path = "/usr/share/facepass/models/face_detection_yunet_2023mar.onnx"

# Path to SFace face recognition model
sface_path = "/usr/share/facepass/models/face_recognition_sface_2021dec.onnx"

# Path to MiniFASNetV2 anti-spoofing model
anti_spoof_v2_path = "/usr/share/facepass/models/MiniFASNetV2.onnx"

# Path to MiniFASNetV1SE anti-spoofing model
anti_spoof_v1se_path = "/usr/share/facepass/models/MiniFASNetV1SE.onnx"

[anti_spoof]
# Enable anti-spoofing (liveness detection)
enabled = true

# Liveness score threshold (0.0-1.0, higher = stricter)
threshold = 0.5

# Anti-spoof mode:
#   "minifasnet_v2"   -> use only MiniFASNetV2
#   "minifasnet_v1se" -> use only MiniFASNetV1SE
#   "fusion"          -> use both and average probabilities
mode = "fusion"

# MiniFASNetV2 input size and crop scale, matching training distribution
v2_input_size = 80
v2_crop_scale = 2.7

# MiniFASNetV1SE input size and crop scale, matching training distribution
v1se_input_size = 80
v1se_crop_scale = 4.0

[storage]
# Path to store face data
data_dir = "/var/lib/facepass/faces"
