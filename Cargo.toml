[workspace]
resolver = "2"
members = [
    "facepass-core",
    "facepass-daemon",
    "facepass-pam",
    "facepass-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ysltr"]
license = "MIT"
repository = "https://github.com/ysltr/facepass"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
toml = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
thiserror = "2"
anyhow = "1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Image processing
opencv = "0.98"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
