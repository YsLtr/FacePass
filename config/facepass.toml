active_preset = "dev"

[base.video]
device = "/dev/video0"
timeout = 5
max_frames = 30
frame_width = 640
frame_height = 480

[base.recognition]
similarity_threshold = 0.4
max_faces_per_group = 5
consecutive_match_frames = 1
valid_frames = 5
stop_on_valid_frames = true
valid_crop_scale = 2.7

[base.security]
ignore_ssh = true
ignore_closed_lid = true
show_notification = false

[base.daemon]
socket_path = "/run/facepass/facepass.sock"
log_level = "info"
pid_file = "/run/facepass/facepass.pid"

[base.models]
active_detector = "scrfd"
active_recognizer = "ghostfacenet"
anti_spoof_v2_path = "/usr/share/facepass/models/MiniFASNetV2.onnx"
anti_spoof_v1se_path = "/usr/share/facepass/models/MiniFASNetV1SE.onnx"

[base.models.yunet]
path = "/usr/share/facepass/models/face_detection_yunet_2023mar.onnx"
input_width = 320
input_height = 320
score_threshold = 0.9
nms_threshold = 0.3

[base.models.scrfd]
path = "/usr/share/facepass/models/SCRFD_2.5g_bnkps.onnx"
input_width = 640
input_height = 640
score_threshold = 0.5
nms_threshold = 0.4

[base.models.sface]
path = "/usr/share/facepass/models/face_recognition_sface_2021dec.onnx"
model_id = "sface-128"
embedding_dim = 128

[base.models.sface.preprocess]
input_width = 112
input_height = 112
input_layout = "nchw"
color_order = "bgr"
mean = [0.0, 0.0, 0.0]
std = [1.0, 1.0, 1.0]
l2_normalize = true

[base.models.mobilefacenet]
path = "/usr/share/facepass/models/MobileFaceNet.onnx"
model_id = "mobilefacenet-128"
embedding_dim = 128

[base.models.mobilefacenet.preprocess]
input_width = 112
input_height = 112
input_layout = "nchw"
color_order = "rgb"
mean = [127.5, 127.5, 127.5]
std = [127.5, 127.5, 127.5]
l2_normalize = true

[base.models.ghostfacenet]
path = "/usr/share/facepass/models/GhostFaceNet_W1.3_S1_ArcFace-ir11.onnx"
model_id = "ghostfacenet-w1.3-s1-arcface-ir11-512"
embedding_dim = 512

[base.models.ghostfacenet.preprocess]
input_width = 112
input_height = 112
input_layout = "nhwc"
color_order = "rgb"
mean = [127.5, 127.5, 127.5]
std = [128.0, 128.0, 128.0]
l2_normalize = true

[base.anti_spoof]
enabled = true
threshold = 0.5
mode = "fusion"
v2_input_size = 80
v2_crop_scale = 2.7
v1se_input_size = 80
v1se_crop_scale = 4.0

[base.storage]
data_dir = "/var/lib/facepass/faces"

[presets.dev.models]
active_detector = "yunet"
active_recognizer = "ghostfacenet"
anti_spoof_v1se_path = "/home/ysltr/builds/FacePass/facepass/models/MiniFASNetV1SE.onnx"
