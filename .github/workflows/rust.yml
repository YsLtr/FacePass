name: Rust Build on Arch

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # 提示 clang-sys 去哪里找库（通常 pacman 安装后在 /usr/lib）
  LIBCLANG_PATH: /usr/lib

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          # 1. 更新系统并安装基础开发工具、Rust 和 Clang
          # clang 是修复你报错的关键
          pacman -Syu --noconfirm base-devel rustup clang llvm

          # 2. 初始化 Rust 环境
          rustup default stable

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose
