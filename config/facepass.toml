active_preset = "dev"

[base.video]
device = "/dev/video0"
timeout = 5
max_frames = 30
frame_width = 640
frame_height = 480

[base.detection]
score_threshold = 0.9
nms_threshold = 0.3
input_width = 320
input_height = 320

[base.recognition]
similarity_threshold = 0.4
max_faces_per_group = 5
consecutive_match_frames = 1
valid_frames = 5
stop_on_valid_frames = true
valid_crop_scale = 2.7

[base.security]
ignore_ssh = true
ignore_closed_lid = true
show_notification = false

[base.daemon]
socket_path = "/run/facepass/facepass.sock"
log_level = "info"
pid_file = "/run/facepass/facepass.pid"

[base.models]
yunet_path = "/usr/share/facepass/models/face_detection_yunet_2023mar.onnx"
sface_path = "/usr/share/facepass/models/face_recognition_sface_2021dec.onnx"
anti_spoof_v2_path = "/usr/share/facepass/models/MiniFASNetV2.onnx"
anti_spoof_v1se_path = "/usr/share/facepass/models/MiniFASNetV1SE.onnx"

[base.anti_spoof]
enabled = true
threshold = 0.5
mode = "fusion"
v2_input_size = 80
v2_crop_scale = 2.7
v1se_input_size = 80
v1se_crop_scale = 4.0

[base.storage]
data_dir = "/var/lib/facepass/faces"

[presets.dev.anti_spoof]
threshold = 0.9

[presets.dev.daemon]
log_level = "debug"

[presets.dev.models]
anti_spoof_v1se_path = "/home/ysltr/builds/FacePass/facepass/models/MiniFASNetV1SE.onnx"
anti_spoof_v2_path = "/home/ysltr/builds/FacePass/facepass/models/MiniFASNetV2.onnx"
sface_path = "/home/ysltr/builds/FacePass/facepass/models/face_recognition_sface_2021dec.onnx"
yunet_path = "/home/ysltr/builds/FacePass/facepass/models/face_detection_yunet_2023mar.onnx"

[presets.dev.recognition]
consecutive_match_frames = 10
similarity_threshold = 0.7
valid_crop_scale = 2.0
valid_frames = 30

[presets.dev.storage]
data_dir = "/home/ysltr/builds/FacePass/facepass/data/faces"

[presets.dev.video]
device = "/dev/video2"
max_frames = 50
timeout = 5
